name: KB validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate KB entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Validate frontmatter & ids
        run: pnpm validate

      - name: Lint content style
        run: pnpm lint

      - name: Export for RAG (dry run)
        run: pnpm export
